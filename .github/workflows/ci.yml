name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: linux-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --ignore-scripts

      - name: Lint (node --check)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: CLI smoke (clean fixture)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -R test/fixtures/clean/. "$tmp"/
          cd "$tmp"
          git init -q
          git add -A
          git -c user.email=ci@example.com -c user.name=ci commit -q -m init
          node "$GITHUB_WORKSPACE/src/cli.js" lux all

      - name: CLI smoke (dirty fixture exits 1)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -R test/fixtures/dirty/. "$tmp"/
          cd "$tmp"
          git init -q
          git add -A
          git -c user.email=ci@example.com -c user.name=ci commit -q -m init
          if node "$GITHUB_WORKSPACE/src/cli.js" lux all; then
            echo "ERROR: dirty fixture should have failed" >&2
            exit 1
          else
            echo "OK: dirty fixture correctly flagged"
          fi
