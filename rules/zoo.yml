# Brand sovereignty rule — zooai/* and zoo-labs/* repos
#
# Zoo Labs Foundation runs the open AI/science research network. Zoo repos
# must not carry the brand identity of Liquidity (downstream tenant) or
# sibling orgs (Lux, Hanzo, Pars). Chain identifiers and OSS dep imports
# are allowed via exempt_paths / exempt_patterns.
#
# Per ZIP-0031 §6 (Academic Collaboration Exception): model cards, papers,
# datasets, and BibTeX citations may name external organisations (incl.
# sibling orgs) for attribution. Those surfaces are exempted by file glob
# (model_card*, MODEL_CARD*, *.bib, papers/**, datasets/**/README*).
#
# Policy: ZIP-0031.

org: zoo

forbidden_in_source:
  - "Liquidity.io"
  - "Liquidity LLC"
  - "@liquidityio/"
  - "Lux Industries"
  - "Hanzo AI Inc."
  - "Pars Network Foundation"

exempt_paths:
  - "**/go.mod"
  - "**/go.sum"
  - "**/package.json"
  - "**/package-lock.json"
  - "**/yarn.lock"
  - "**/pnpm-lock.yaml"
  - "**/bun.lock"
  - "**/bun.lockb"
  - "**/Cargo.toml"
  - "**/Cargo.lock"
  - "**/pyproject.toml"
  - "**/uv.lock"
  - "**/requirements*.txt"
  - "**/Dockerfile"
  - "**/Dockerfile.*"
  - "**/*.Dockerfile"
  - "**/compose.yml"
  - "**/compose.*.yml"
  - "**/*.k8s.yaml"
  - "**/*.k8s.yml"
  - "**/kustomization.yaml"
  - "**/kustomization.yml"
  - "**/.github/**"
  - "**/CHANGELOG.md"
  - "**/CHANGELOG"
  - "**/LICENSE"
  - "**/LICENSE.*"
  - "**/NOTICE"
  - "**/NOTICE.*"
  - "**/THIRD_PARTY*"
  - "**/vendor/**"
  - "**/node_modules/**"
  - "**/BRAND-AUDIT*"
  - "**/BRAND_AUDIT*"
  - "**/brand-audit*"
  - "**/brand-sovereignty*"
  - "**/.env.example*"
  - "**/.env.sample*"
  - "**/config/brands/**"
  - "**/configs/brands/**"
  - "**/brands/**/*.json"
  - "**/brands/**/*.yaml"
  - "**/brands/**/*.yml"
  - "**/brand*.test.ts"
  - "**/brand*.test.tsx"
  - "**/brand*.test.js"
  - "**/brand*.spec.ts"
  - "**/brand*.spec.tsx"
  - "**/brand*.spec.js"
  - "**/*brand*.test.ts"
  - "**/*brand*.test.tsx"
  - "**/whitelabel*.test.*"
  - "**/white-label*.test.*"
  - "**/tenant*.test.*"
  - "**/*_brand_test.go"
  - "**/*_whitelabel_test.go"
  # ZIP-0031 §6 — Academic Collaboration Exception.
  # Model cards, papers, datasets, citations legitimately name other orgs.
  - "**/model_card*"
  - "**/MODEL_CARD*"
  - "**/model-card*"
  - "**/*.bib"
  - "**/CITATION*"
  - "**/citation*"
  - "**/papers/**"
  - "**/paper/**"
  - "**/datasets/**/README*"
  - "**/dataset/**/README*"
  - "**/research/**/README*"

exempt_patterns:
  - 'github\.com/luxfi/'
  - 'github\.com/hanzoai/'
  - 'github\.com/zooai/'
  - 'github\.com/zoo-labs/'
  - 'github\.com/parsdao/'
  - 'github\.com/liquidityio/'
  - 'ghcr\.io/'
  - 'us-docker\.pkg\.dev/'
